<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <meta name="theme-color" content="#06117A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Campus-ERP" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Campus-ERP · Basaveshwar Science College</title>
  <style>
    /* -----------------------------------------------------------
     *  Campus-ERP Cinematic Apple-style Boot Splash
     * ---------------------------------------------------------*/
    html,
    body {
      margin: 0;
      padding: 0;
      background: #040A42;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 45%, #1026c4 0%, #07127e 50%, #030836 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1), transform 450ms cubic-bezier(0.4, 0, 0.2, 1), visibility 450ms ease;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      user-select: none;
      -webkit-user-select: none;
    }

    #boot.--hide {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    /* Ambient Glow Behind Tile */
    .glow-aura {
      position: absolute;
      width: clamp(240px, 60vw, 340px);
      height: clamp(240px, 60vw, 340px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(139, 92, 246, 0.25) 50%, transparent 70%);
      filter: blur(40px);
      animation: aura-pulse 4s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    /* The Center Gradient Logo Tile */
    .tile-container {
      position: relative;
      z-index: 1;
      animation: tile-spring 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .logo-tile {
      width: clamp(140px, 38vw, 175px);
      height: clamp(140px, 38vw, 175px);
      border-radius: clamp(28px, 7vw, 38px);
      background: linear-gradient(140deg, #2f80ed 0%, #3b45f6 48%, #8e2de2 100%);
      box-shadow:
        0 24px 60px -10px rgba(14, 43, 185, 0.7),
        0 10px 30px rgba(142, 45, 226, 0.4),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: tile-float 5s ease-in-out 900ms infinite;
    }

    /* Light Sweep Sheen */
    .logo-tile::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 220%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 35%,
        rgba(255, 255, 255, 0.03) 40%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0.03) 60%,
        transparent 65%
      );
      transform: rotate(25deg);
      animation: light-sheen 3.6s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite;
      pointer-events: none;
    }

    /* SVG Emblem */
    .emblem-svg {
      width: 68%;
      height: 68%;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.22));
      z-index: 2;
    }

    /* Sleek Loading Bar */
    .bar-container {
      margin-top: clamp(38px, 9vh, 52px);
      width: clamp(160px, 46vw, 210px);
      height: 3.5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      position: relative;
      overflow: hidden;
      z-index: 1;
      backdrop-filter: blur(4px);
    }

    .bar-runner {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent 0%, #60A5FA 40%, #FFFFFF 85%, #BAE6FD 100%);
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.8), 0 0 4px #fff;
      animation: bar-slide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    /* Typography */
    .brand-title {
      margin-top: 22px;
      font-size: clamp(16px, 4.2vw, 19px);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      z-index: 1;
      animation: text-fade 800ms ease 300ms both;
    }

    .brand-sub {
      margin-top: 4px;
      font-size: clamp(11px, 2.8vw, 12.5px);
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 500;
      z-index: 1;
      animation: text-fade 800ms ease 450ms both;
    }

    .msg {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      min-height: 14px;
      opacity: 0;
      transition: opacity 400ms ease;
      z-index: 1;
    }

    .msg.--show {
      opacity: 1;
    }

    /* Animations */
    @keyframes tile-spring {
      0% {
        opacity: 0;
        transform: scale(0.65) translateY(20px);
      }
      60% {
        opacity: 1;
        transform: scale(1.04) translateY(-3px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes tile-float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.01);
      }
    }

    @keyframes aura-pulse {
      0% {
        opacity: 0.5;
        transform: scale(0.9);
      }
      100% {
        opacity: 0.9;
        transform: scale(1.15);
      }
    }

    @keyframes light-sheen {
      0% {
        transform: translateX(-150%) rotate(25deg);
      }
      35%, 100% {
        transform: translateX(150%) rotate(25deg);
      }
    }

    @keyframes bar-slide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(250%);
      }
    }

    @keyframes text-fade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-tile,
      .glow-aura,
      .tile-container,
      .bar-runner,
      .logo-tile::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Cinematic Boot Splash Screen -->
  <div id="boot" aria-hidden="true">
    <div class="glow-aura"></div>

    <div class="tile-container">
      <div class="logo-tile">
        <!-- Campus ERP Circular Emblem with Mortarboard, Book, and Notification Status Bars -->
        <svg class="emblem-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Circular C-Shape Ring -->
          <path
            d="M 124 36 C 80 20 28 46 22 96 C 16 146 54 184 102 182 C 128 181 146 168 156 150"
            stroke="#FFFFFF"
            stroke-width="17"
            stroke-linecap="round"
          />

          <!-- Graduation Mortarboard Top -->
          <path
            d="M 100 78 L 138 98 L 100 118 L 62 98 Z"
            fill="#FFFFFF"
          />

          <!-- Mortarboard Cap Base -->
          <path
            d="M 76 107 V 122 C 76 130 87 136 100 136 C 113 136 124 130 124 122 V 107"
            fill="#FFFFFF"
          />

          <!-- Tassel Ribbon & Ball -->
          <path
            d="M 130 102 V 120"
            stroke="#FFFFFF"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <circle cx="130" cy="122" r="3" fill="#FFFFFF" />

          <!-- Open Book Wings Below Cap -->
          <path
            d="M 68 136 C 82 132 94 135 100 144 C 106 135 118 132 132 136 C 130 148 116 157 100 162 C 84 157 70 148 68 136 Z"
            fill="#FFFFFF"
            opacity="0.95"
          />

          <!-- Three Data / Notification Status Bars on Right -->
          <rect x="146" y="86" width="18" height="7" rx="3.5" fill="#FFFFFF" opacity="0.5" />
          <rect x="146" y="99" width="28" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
          <rect x="146" y="113" width="22" height="7.5" rx="3.75" fill="#FFFFFF" opacity="0.75" />
        </svg>
      </div>
    </div>

    <!-- Glowing Loading Bar -->
    <div class="bar-container" role="progressbar" aria-label="Loading Campus ERP">
      <div class="bar-runner"></div>
    </div>

    <!-- Branding Text -->
    <div class="brand-title">Campus ERP</div>
    <div class="brand-sub">Basaveshwar Science College · Bagalkote</div>
    <div id="boot-msg" class="msg"></div>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      var msg = document.getElementById('boot-msg');
      var t1 = setTimeout(function () {
        if (!msg) return;
        msg.textContent = 'Syncing your semester data…';
        msg.classList.add('--show');
      }, 2400);

      var t2 = setTimeout(function () {
        if (!msg) return;
        msg.textContent = 'Almost ready…';
      }, 7000);

      // Failsafe guarantee: boot screen dismissed
      var t3 = setTimeout(function () {
        window.__hideBoot && window.__hideBoot();
      }, 7500);

      window.__hideBoot = function () {
        clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
        var el = document.getElementById('boot');
        if (!el) return;
        el.classList.add('--hide');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 480);
      };
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
